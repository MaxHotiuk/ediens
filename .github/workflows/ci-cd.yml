name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/ediens-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/ediens-web
        run: npm ci

      - name: Build and Verify
        run: |
          if [ -f "./scripts/verify.sh" ]; then
            chmod +x ./scripts/verify.sh
            ./scripts/verify.sh
          else
            dotnet build src/Ediens.Api/Ediens.Api.csproj
            cd src/ediens-web && npm run build
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to homeserver via Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_TS_IP }} << 'EOF'
            set -e
            cd /opt/ediens
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if [ ! -d ".git" ]; then
              git clone "$REPO_URL" .
            else
              git remote set-url origin "$REPO_URL"
            fi
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            docker compose -f compose.yaml up -d --build --remove-orphans
            docker image prune -f
          EOF
