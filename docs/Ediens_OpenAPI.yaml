    # -------------------------------------------------------------------------
    # RFC 9457 PROBLEM DETAILS DATA STRUCTURES
    # -------------------------------------------------------------------------
    BaseProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - errorCode
        - traceId
        - timestamp
      properties:
        type:
          type: string
          format: uri
          description: Абсолютний URI класу проблеми згідно з RFC 9457.
          example: "https://ediens.app/errors/generic-error"
        title:
          type: string
          description: Короткий стабільний людиночитний опис типу проблеми.
          example: "A business domain error occurred."
        status:
          type: integer
          description: Код стану протоколу HTTP.
          example: 400
        detail:
          type: string
          description: Детальне пояснення конкретного випадку помилки.
          example: "Detailed explanation of the error."
        instance:
          type: string
          description: URI ендпоінту, де сталася помилка.
          example: "/api/v1/resource/123"
        errorCode:
          type: string
          description: Унікальний машинночитний код помилки в UPPER_SNAKE_CASE.
          example: "GENERIC_ERROR"
        traceId:
          type: string
          description: Ідентифікатор W3C TraceContext для аудиту та розподіленого трейсингу.
          example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        timestamp:
          type: string
          format: date-time
          description: Часова мітка виникнення помилки за стандартом ISO-8601 UTC.
          example: "2026-10-31T08:05:00.120Z"

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/BaseProblemDetails'
        - type: object
          properties:
            extensions:
              type: object
              required:
                - errors
              properties:
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  example:
                    quantity:
                      - "Quantity must be greater than 0."
                    unit:
                      - "Unit 'kilogram' is invalid. Permitted units: 'g', 'ml', 'pcs'."
                invalidParams:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      reason:
                        type: string
                      value: {}

    UnauthorizedProblemDetails:
      allOf:
        - $ref: '#/components/schemas/BaseProblemDetails'
        - type: object
          properties:
            extensions:
              type: object
              properties:
                tokenExpiredAt:
                  type: string
                  format: date-time
                  example: "2026-10-31T07:55:00Z"
                canRefresh:
                  type: boolean
                  example: true

    HouseholdAccessDeniedProblemDetails:
      allOf:
        - $ref: '#/components/schemas/BaseProblemDetails'
        - type: object
          properties:
            extensions:
              type: object
              required:
                - householdId
                - requiredRole
              properties:
                householdId:
                  type: string
                  format: uuid
                  example: 0192e2b0-8812-7001-9011-aa9988776655
                requiredRole:
                  type: string
                  example: "Member"
                currentMembershipStatus:
                  type: string
                  example: "NOT_A_MEMBER"

    ItemNotFoundProblemDetails:
      allOf:
        - $ref: '#/components/schemas/BaseProblemDetails'
        - type: object
          properties:
            extensions:
              type: object
              required:
                - resourceType
                - resourceId
              properties:
                resourceType:
                  type: string
                  example: "InventoryBatch"
                resourceId:
                  type: string
                  example: "0192e2b3-5730-7432-8411-cf0b91d23456"

    ConcurrentModificationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/BaseProblemDetails'
        - type: object
          properties:
            extensions:
              type: object
              required:
                - currentETag
                - currentQuantity
                - unit
              properties:
                currentETag:
                  type: string
                  description: Актуальний ETag на сервері.
                  example: 'W/"10425"'
                clientExpectedETag:
                  type: string
                  description: Застарілий ETag, надісланий у If-Match.
                  example: 'W/"10423"'
                currentQuantity:
                  type: number
                  description: Поточний актуальний залишок у БД.
                  example: 600.0
                unit:
                  $ref: '#/components/schemas/MeasurementUnit'
                productName:
                  type: string
                  example: "Молоко 'Селянське' 2.5%"
                lastModifiedBy:
                  type: string
                  example: "Anna"
                lastModifiedAt:
                  type: string
                  format: date-time
                  example: "2026-10-31T08:05:58.210Z"

    IdempotencyConflictProblemDetails:
      allOf:
        - $ref: '#/components/schemas/BaseProblemDetails'
        - type: object
          properties:
            extensions:
              type: object
              required:
                - idempotencyKey
                - state
              properties:
                idempotencyKey:
                  type: string
                  format: uuid
                  example: 0192e2b9-1122-7f30-8111-cc0099887766
                state:
                  type: string
                  enum: [IN_FLIGHT, COMPLETED_WITH_DIFFERENT_PAYLOAD]
                  example: IN_FLIGHT
                lockExpiresInMs:
                  type: integer
                  example: 2400

    MissingIngredientDetail:
